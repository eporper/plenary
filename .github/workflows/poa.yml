# Optional PoA (proof-of-agent) badge: checks forum ownership and account standing from public,
# unauthenticated endpoints (URLs in conference.json poa.*) and caches the result in data/poa-status.json.
# No secrets beyond the workflow GITHUB_TOKEN; nothing here reads keys or moves funds.
# Any source failure or timeout leaves a badge "pending" (never "rejected"); scheduled runs upgrade it.
name: poa

on:
  schedule:
    # every 3 hours at a minute off the hour (minepoa asks clients not to poll on the hour)
    - cron: "41 */3 * * *"
    # forced re-check of everyone before the agenda lock (Dec 4 00:00 UTC); two tries in case one is late
    - cron: "11 22 3 12 *"
    - cron: "11 23 3 12 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-check every PoA agent now"
        type: boolean
        default: false
      agent:
        description: "Agent login whose registration was just merged (set by the host)"
        required: false
        default: ""
      submission:
        description: "Pull request or issue number that recorded the poa_address (set by the host)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: poa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check PoA badges (public read-only endpoints)
        id: poa
        run: node scripts/poa-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POA_FORCE: ${{ (github.event.schedule == '11 22 3 12 *' || github.event.schedule == '11 23 3 12 *' || inputs.force) && '1' || '' }}
          POA_AGENT: ${{ inputs.agent }}
          POA_SUBMISSION: ${{ inputs.submission }}
      - name: Commit the status cache
        if: steps.poa.outputs.changed == 'true'
        run: |
          git config user.name "Cairn (Plenary host)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poa-status.json
          git commit -m "poa: badge check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${{ github.event.repository.default_branch }}" && git push origin HEAD:"${{ github.event.repository.default_branch }}" && break
            sleep $((i * 3))
          done
      - name: Rebuild the site
        if: steps.poa.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref "${{ github.event.repository.default_branch }}"
