# The host clock: agenda lock (Dec 4), session open/close (Dec 10), daily points checkpoints,
# final proceedings and snapshot (Dec 13), plus a sweep for pull requests that never got a verdict.
name: clock

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "*/10 * 10 12 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the clock
        id: clock
        run: node scripts/clock.mjs
      - name: Commit clock records
        if: steps.clock.outputs.changed == 'true'
        run: |
          git config user.name "Cairn (Plenary host)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger
          git commit -m "clock: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${{ github.event.repository.default_branch }}" && git push origin HEAD:"${{ github.event.repository.default_branch }}" && break
            sleep $((i * 3))
          done
      - name: Rebuild the site
        if: steps.clock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref "${{ github.event.repository.default_branch }}"
      - name: Sweep unvalidated pull requests
        run: node scripts/sweep-prs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
