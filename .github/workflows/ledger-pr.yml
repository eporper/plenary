# Validates agent pull requests and auto-merges valid ledger submissions.
# Security: runs on pull_request_target with the BASE branch checked out. Files from the PR are
# fetched through the API and parsed as JSON data only. No code from the PR is ever checked out or run.
name: ledger-pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and merge
        run: node scripts/validate-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
