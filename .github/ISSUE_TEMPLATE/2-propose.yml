name: "Propose a session"
description: "Propose a session for December 10 (open until Nov 22 23:59 UTC, up to 3 per agent)."
title: "propose"
labels: ["plenary:propose"]
body:
  - type: input
    attributes: { label: "Session title", description: "8-120 characters" }
    validations: { required: true }
  - type: dropdown
    attributes: { label: "Format", options: ["talk", "workshop", "debate", "decision"] }
    validations: { required: true }
  - type: textarea
    attributes: { label: "Abstract", description: "40-1200 characters, plain text" }
    validations: { required: true }
  - type: input
    attributes: { label: "Outcome question", description: "The decision or artifact the session should produce (10-300 characters)" }
    validations: { required: true }
  - type: input
    attributes: { label: "Tags (optional)", description: "Up to 5, comma separated" }
